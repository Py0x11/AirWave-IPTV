<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirWave TV</title>
<link rel="icon" href="/assets/logos/netflix-mod-red.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="splash" class="splash hidden">
  <div class="splash-inner">
    <div id="splash-logo" class="splash-logo">AIR<span>WAVE</span></div>
    <div class="splash-bar"><div id="splash-fill" class="splash-fill"></div></div>
  </div>
</div>

<div id="topnav">
  <img id="logo" class="focusable" data-zone="nav" src="/assets/logos/netflix-mod-red.png" alt="AirWave TV">
  <div id="nav-list">
    <button id="nav-live" class="nav-pill focusable" data-zone="nav" data-screen="live">Live TV</button>
    <button id="nav-fav" class="nav-pill focusable" data-zone="nav" data-screen="favorites">My List</button>
    <button id="nav-recent" class="nav-pill focusable" data-zone="nav" data-screen="recent">Recently Watched</button>
    <button id="nav-lang" class="nav-pill focusable" data-zone="nav" data-screen="lang">Browse by Languages</button>
  </div>
  <div class="nav-right">
    <div id="search-bar"><input id="search-input" data-zone="search" placeholder="Titles, countries, languages" autocomplete="off" spellcheck="false"></div>
    <button id="btn-search" class="icon-btn focusable" data-zone="nav" aria-label="Search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg></button>
    <button id="btn-settings" class="icon-btn focusable" data-zone="nav" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61zM12 15.6A3.6 3.6 0 0 1 8.4 12c0-1.98 1.62-3.6 3.6-3.6s3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6"/></svg></button>
    <img id="avatar" class="focusable" data-zone="nav" src="/assets/logos/netflix-profile-logo.png" alt="Profile">
  </div>
</div>

<div id="hero">
  <img id="hero-bg" alt="">
  <video id="hero-video" muted playsinline></video>
  <div class="hero-fade"></div>
  <div class="hero-inner">
    <div id="hero-word">AIR<span>WAVE</span></div>
    <img id="hero-logo" alt="">
    <div id="hero-title"></div>
    <div id="hero-meta"></div>
    <div id="hero-desc"></div>
    <div class="hero-btns">
      <button id="hero-play" class="hbtn play focusable" data-zone="bill"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>Play</span></button>
      <button id="hero-fav" class="hbtn mylist focusable" data-zone="bill"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg><span>My List</span></button>
      <button id="hero-info" class="hbtn mylist focusable" data-zone="bill"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg><span>Info</span></button>
    </div>
  </div>
</div>

<main id="rows"></main>

<div id="player-box" class="hidden">
  <video id="video" playsinline></video>
  <div id="p-placeholder" class="hidden">
    <div id="p-ph-logo">AIR<span>WAVE</span></div>
    <div id="p-ph-title"></div>
    <button id="p-ph-back" class="pctl" type="button">&#8592; Back</button>
  </div>
  <div id="p-spinner" class="spin hidden"></div>
  <div id="p-stats" hidden></div>
  <div id="p-top"><button id="p-back" class="pctl" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button><div id="p-title"></div></div>
  <div id="fs-controls" data-zone="panel">
    <div id="p-bar" class="focusable" data-zone="panel"><div id="p-fill"></div><div id="p-dot"></div></div>
    <div id="fs-row">
      <button id="fs-play" class="pctl" aria-label="Play/Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="fs-mute" class="pctl" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12z"/></svg></button>
      <input id="fs-vol" type="range" min="0" max="100" value="100" data-zone="panel">
      <div id="fs-title"></div>
      <div id="fs-live">LIVE</div>
      <div id="fs-time">0:00:00</div>
      <button id="fs-stats" class="pctl sm" title="Stats for nerds (S)"><svg viewBox="0 0 24 24"><path d="M3 13h2v8H3zm4-8h2v16H7zm4 4h2v12h-2zm4-8h2v20h-2z"/></svg></button>
      <button id="fs-full" class="pctl" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7zm-2-4h2V7h3V5H5zm12 7h-3v2h5v-5h-2zM14 5v2h3v3h2V5z"/></svg></button>
    </div>
  </div>
</div>

<div id="overlay-detail" class="overlay hidden">
  <div class="d-card">
    <button id="d-close" class="pctl d-close-btn" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m19 6.41-1.41-1.41-5.59 5.59-5.59-5.59L5 6.41 10.59 12 5 17.59 6.41 19l5.59-5.59 5.59 5.59L19 17.59 13.41 12z"/></svg></button>
    <div id="d-media">
      <div id="d-fallback"></div>
      <img id="d-img" alt="">
      <div class="d-grad"></div>
    </div>
    <div class="d-body">
      <div id="d-title"></div>
      <div class="d-btns">
        <button id="d-play" class="d-play focusable" data-zone="detail"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>Play</span></button>
        <button id="d-fav" class="d-ghost focusable" data-zone="detail"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg><span>My List</span></button>
        <button id="d-share" class="d-ghost focusable" data-zone="detail"><svg viewBox="0 0 24 24"><path d="M18 16.08a2.9 2.9 0 0 0-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.51 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81A2.9 2.9 0 0 0 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.75 0 1.45-.28 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92"/></svg><span>Share</span></button>
      </div>
      <div id="d-progress" class="hidden"><div id="d-fill"></div><span id="d-left"></span></div>
      <div id="d-meta"></div>
      <div id="d-desc"></div>
      <div class="d-heading">More Like This</div>
      <div id="d-row"></div>
    </div>
  </div>
</div>

<div id="overlay-settings" class="overlay hidden">
  <div class="settings-card">
    <div class="set-head">Settings</div>
    <div id="settings-dialog"></div>
    <button id="btn-settings-close" class="small-btn focusable" data-zone="settings">Done</button>
  </div>
</div>

<div id="login-overlay" class="hidden">
  <div class="netflix-card">
    <div class="netflix-brand">
      <img class="netflix-logo" src="/assets/logos/netflix-mod-red.png" alt="AirWave TV" />
    </div>
    <div id="netflix-profile-row">
      <div id="netflix-avatar" class="netflix-avatar">
        <img src="/assets/logos/netflix-profile-logo.png" alt="" />
      </div>
      <div id="netflix-name" class="netflix-name">AirWave</div>
    </div>
    <input id="netflix-name-input" class="netflix-input" placeholder="Profile name" maxlength="24" autocomplete="off" />
    <button id="netflix-signin" class="netflix-btn" type="button">Sign In</button>
  </div>
</div>

<div id="toasts"></div>

<script src="/vendor/hls.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
